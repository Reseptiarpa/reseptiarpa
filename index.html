<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reseptiarpa</title>
<style>
  html, body { margin: 0; min-height: 100%; background: #f7f5f0; }
  iframe { display: block; width: 100%; height: 1000px; border: 0; }
  iframe[hidden] { display: none !important; }

  #cookieConsentBanner[hidden] { display: none !important; }
  #cookieConsentBanner {
    position: fixed;
    z-index: 10000;
    left: 10px;
    right: 10px;
    bottom: 10px;
    width: min(520px, calc(100% - 20px));
    margin: 0 auto;
    padding: 13px 16px 12px;
    border: 1px solid #e9e6dd;
    border-radius: 20px;
    background: #fff;
    color: #1c1917;
    box-shadow: 0 8px 26px rgba(28, 25, 23, .18);
    box-sizing: border-box;
    font-family: "Plus Jakarta Sans", system-ui, sans-serif;
    text-align: center;
  }
  #cookieConsentBanner * { box-sizing: border-box; }
  #cookieConsentBanner p {
    max-width: 480px;
    margin: 0 auto;
    color: #6f6a63;
    font-size: 12px;
    line-height: 1.45;
  }
  #cookieConsentBanner a {
    color: inherit;
    font-weight: 700;
    text-decoration: none;
  }
  #cookieConsentBanner a:hover {
    color: inherit;
    opacity: .78;
    text-decoration: none;
  }
  #cookieConsentBanner .cookie-actions {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
    width: min(350px, 100%);
    margin: 10px auto 0;
  }
  #cookieConsentBanner button {
    display: flex;
    min-height: 36px;
    align-items: center;
    justify-content: center;
    padding: 8px 10px;
    border: 1px solid #e5482f;
    border-radius: 99px;
    background: #e5482f;
    color: #fff;
    font: inherit;
    font-size: 12px;
    font-weight: 800;
    line-height: 1.2;
    cursor: pointer;
    transition: background .15s ease, border-color .15s ease, transform .15s ease;
  }
  #cookieConsentBanner button:hover {
    background: #d63f27;
    border-color: #d63f27;
  }
  #cookieConsentBanner button:active { transform: translateY(1px); }
  #cookieConsentBanner button:focus-visible,
  #cookieConsentBanner a:focus-visible {
    outline: 3px solid rgba(229, 72, 47, .35);
    outline-offset: 3px;
  }
  @media (max-width: 560px) {
    #cookieConsentBanner {
      left: 10px;
      right: 10px;
      bottom: 10px;
      width: calc(100% - 20px);
      padding: 12px 12px 11px;
      border-radius: 18px;
    }
    #cookieConsentBanner p { font-size: 12px; }
    #cookieConsentBanner .cookie-actions { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; margin-top: 9px; }
    #cookieConsentBanner button { min-height: 35px; padding: 7px 6px; font-size: 11.5px; }
  }

</style>
</head>
<body>
<iframe id="pageFrame" title="Reseptiarpa" aria-label="Reseptiarpa ja ravintolaruletti"></iframe>
<iframe id="rouletteFrame" title="Ravintolaruletti" aria-label="Ravintolaruletti" hidden></iframe>
<aside id="cookieConsentBanner" role="region" aria-label="Evästevalinnat" aria-describedby="cookieConsentDescription" hidden>
  <p id="cookieConsentDescription">Käytämme välttämätöntä tallennustilaa valintasi muistamiseen. Lisätietoja muista ehdoista löydät <a href="#tietosuojaseloste" id="cookiePolicyLink">Tietosuojaselosteesta</a>.</p>
  <div class="cookie-actions">
    <button type="button" id="cookieAcceptAll">Hyväksy kaikki</button>
    <button type="button" id="cookieRejectButton">En hyväksy</button>
  </div>
</aside>
<script>

  "use strict";

  // Evästevalinta tallennetaan vain tähän selaimeen. Valinta pyydetään uudelleen 180 päivän kuluttua.
  const CONSENT_STORAGE_KEY = "reseptiarpa_cookie_consent_v1";
  const CONSENT_MAX_AGE_MS = 180 * 24 * 60 * 60 * 1000;

  // LISÄÄ GOOGLE ANALYTICS ID TÄHÄN (muotoa G-XXXXXXXXXX).
  const GOOGLE_ANALYTICS_ID = "G-S03T9S4M94";
  // LISÄÄ GOOGLE ADS ID TÄHÄN (muotoa AW-XXXXXXXXXX).
  const GOOGLE_ADS_ID = "AW-XXXXXXXXXX";

  const CONSENT_DENIED = {
    analytics_storage: "denied",
    ad_storage: "denied",
    ad_user_data: "denied",
    ad_personalization: "denied"
  };
  const CONSENT_GRANTED = {
    analytics_storage: "granted",
    ad_storage: "granted",
    ad_user_data: "granted",
    ad_personalization: "granted"
  };

  // Google Consent Mode v2:n oletusarvot asetetaan ennen mahdollista Google-tagin latausta.
  // gtag.js-tiedostoa tai muita Google-seurantatunnisteita ei ladata ennen hyväksyntää.
  window.dataLayer = window.dataLayer || [];
  window.gtag = window.gtag || function () { window.dataLayer.push(arguments); };
  window.gtag("consent", "default", CONSENT_DENIED);

  const cookieBanner = document.getElementById("cookieConsentBanner");
  const acceptAllButton = document.getElementById("cookieAcceptAll");
  const rejectButton = document.getElementById("cookieRejectButton");
  const cookiePolicyLink = document.getElementById("cookiePolicyLink");
  let googleTagInitialized = false;
  let reopenCookieBannerAfterPolicy = false;

  function readSavedConsent() {
    try {
      const saved = JSON.parse(localStorage.getItem(CONSENT_STORAGE_KEY) || "null");
      if (!saved || saved.version !== 1 || !["all", "necessary"].includes(saved.choice)) return null;
      if (!Number.isFinite(saved.updatedAt) || Date.now() - saved.updatedAt > CONSENT_MAX_AGE_MS) return null;
      return saved;
    } catch (_) {
      return null;
    }
  }

  function saveConsent(choice) {
    try {
      localStorage.setItem(CONSENT_STORAGE_KEY, JSON.stringify({
        version: 1,
        choice,
        updatedAt: Date.now()
      }));
    } catch (_) {
      // Jos selain estää localStoragen, valinta toimii tämän sivulatauksen ajan.
    }
  }

  function isConfiguredGoogleId(value, prefix) {
    return typeof value === "string" && new RegExp("^" + prefix + "[A-Z0-9]+$", "i").test(value)
      && !value.includes("XXXXXXXXXX");
  }

  function enableGoogleTracking() {
    window.gtag("consent", "update", CONSENT_GRANTED);
    if (googleTagInitialized) return;

    const hasAnalyticsId = isConfiguredGoogleId(GOOGLE_ANALYTICS_ID, "G-");
    const hasAdsId = isConfiguredGoogleId(GOOGLE_ADS_ID, "AW-");
    window.__reseptiarpaAnalyticsEnabled = hasAnalyticsId;
    if (!hasAnalyticsId && !hasAdsId) return;

    window.gtag("js", new Date());
    if (hasAnalyticsId) {
      // Sivuston näkymät vaihtuvat yhden HTML-sivun sisällä, joten sivulataukset lähetetään itse.
      window.gtag("config", GOOGLE_ANALYTICS_ID, { send_page_view: false });
    }
    if (hasAdsId) {
      window.gtag("config", GOOGLE_ADS_ID);
    }

    const tagScript = document.createElement("script");
    tagScript.async = true;
    tagScript.src = "https://www.googletagmanager.com/gtag/js?id=" + encodeURIComponent(
      hasAnalyticsId ? GOOGLE_ANALYTICS_ID : GOOGLE_ADS_ID
    );
    document.head.appendChild(tagScript);
    googleTagInitialized = true;
    if (typeof window.__reseptiarpaSendPageView === "function") {
      window.__reseptiarpaSendPageView();
    }
  }

  function clearGoogleCookies() {
    const cookieNames = document.cookie.split(";").map(item => item.trim().split("=")[0]);
    const namesToClear = new Set([
      "_ga", "_gid", "_gat", "_gcl_au", "_gcl_aw", "_gcl_dc", "_gac"
    ]);
    cookieNames.forEach(name => {
      if (namesToClear.has(name) || name.startsWith("_ga_") || name.startsWith("_gcl_") || name.startsWith("_gac_")) {
        document.cookie = name + "=; Max-Age=0; path=/; SameSite=Lax";
        document.cookie = name + "=; Max-Age=0; path=/; domain=" + location.hostname + "; SameSite=Lax";
        document.cookie = name + "=; Max-Age=0; path=/; domain=." + location.hostname + "; SameSite=Lax";
      }
    });
  }

  function showCookieBanner() {
    cookieBanner.hidden = false;
    cookieBanner.setAttribute("aria-hidden", "false");
  }

  function hideCookieBanner() {
    cookieBanner.hidden = true;
    cookieBanner.setAttribute("aria-hidden", "true");
  }

  acceptAllButton.addEventListener("click", () => {
    saveConsent("all");
    enableGoogleTracking();
    hideCookieBanner();
  });

  rejectButton.addEventListener("click", () => {
    saveConsent("necessary");
    window.gtag("consent", "update", CONSENT_DENIED);
    clearGoogleCookies();
    hideCookieBanner();
    // Jos käyttäjä peruuttaa aiemman hyväksynnän, lataa sivu uudelleen ilman Google-tageja.
    if (googleTagInitialized) window.location.reload();
  });

  cookiePolicyLink.addEventListener("click", event => {
    event.preventDefault();
    const activeFrame = Array.from(document.querySelectorAll("iframe")).find(frame => !frame.hidden);
    const policyButton = activeFrame && activeFrame.contentDocument
      ? activeFrame.contentDocument.getElementById("privacyOpen")
      : null;
    if (policyButton) {
      reopenCookieBannerAfterPolicy = true;
      hideCookieBanner();
      policyButton.click();
    }
  });

  const savedConsent = readSavedConsent();
  if (savedConsent && savedConsent.choice === "all") {
    enableGoogleTracking();
  } else if (!savedConsent) {
    clearGoogleCookies();
    showCookieBanner();
  }

  };

  const showPage = (name, updateHistory = true) => {
    const page = pages[name] ? name : "recipe";
    activePage = page;
    Object.entries(pages).forEach(([key, item]) => {
      item.frame.hidden = key !== page;
      item.frame.title = item.title;
      if (key === page) item.frame.style.display = "block";
      else item.frame.style.display = "none";
    });
    document.title = pages[page].title;
    if (updateHistory) {
      const hash = "#" + pages[page].hash;
      if (location.hash !== hash) history.pushState({ page }, "", hash);
    }
    if (typeof window.__reseptiarpaSendPageView === "function") {
      window.__reseptiarpaSendPageView();
    }
    window.scrollTo(0, 0);
  };

  window.addEventListener("message", event => {
    const sourcePage = Object.entries(pages).find(([, item]) => item.frame.contentWindow === event.source);
    if (!sourcePage || !event.data || typeof event.data !== "object") return;
    if (event.data.type === "reseptiarpa-cookie-settings") {
      showCookieBanner();
      acceptAllButton.focus();
      return;
    }
    if (event.data.type === "reseptiarpa-privacy-closed") {
      if (reopenCookieBannerAfterPolicy) {
        reopenCookieBannerAfterPolicy = false;
        showCookieBanner();
        acceptAllButton.focus();
      }
      return;
    }
    if (event.data.type === "reseptiarpa-navigate") {
      showPage(event.data.page);
    } else if (event.data.type === "reseptiarpa-height") {
      const height = Number(event.data.height);
      if (Number.isFinite(height) && height > 0) sourcePage[1].frame.style.height = Math.ceil(height) + "px";
    }
  });

  window.addEventListener("popstate", () => {
    showPage(location.hash.toLowerCase().includes("ravintolaruletti") ? "roulette" : "recipe", false);
  });
  window.addEventListener("hashchange", () => {
    showPage(location.hash.toLowerCase().includes("ravintolaruletti") ? "roulette" : "recipe", false);
  });
  showPage(location.hash.toLowerCase().includes("ravintolaruletti") ? "roulette" : "recipe", false);
})();
</script>
</body>
</html>
